<div id="cart-summary" style="display:none;">
  <!-- ... other summary rows ... -->

  <!-- PROMO BOX -->
  <div class="promo-box">
    <label for="promo-code">Promo code</label>
    <div class="promo-row">
      <input
        type="text"
        id="promo-code"
        placeholder="Enter code"
      />
      <button id="apply-promo-btn" class="btn btn-primary">
        Apply
      </button>
      <button id="clear-promo-btn" class="btn btn-ghost">
        Clear
      </button>
    </div>
    <!-- promo message now lives HERE under the box -->
    <div id="promo-message" class="helper-text"></div>
  </div>

  <div class="summary-row">
    <span>Items subtotal</span>
    <span id="items-subtotal">$0.00</span>
  </div>

  <!-- new optional promo line (script shows/hides it) -->
  <div class="summary-row" id="promo-row" style="display:none;">
    <span>Promo discount</span>
    <span id="promo-discount-value"></span>
  </div>

  <div class="summary-row">
    <span>Shipping</span>
    <span id="shipping-estimate">$0.00</span>
  </div>

  <div class="summary-row">
    <span>Expedite fee</span>
    <span id="expedite-fee">$0.00</span>
  </div>

  <div class="summary-row total">
    <strong>Total</strong>
    <strong id="grand-total">$0.00</strong>
  </div>
</div>
